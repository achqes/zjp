<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>zePrevoz</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script async src="https://www.googletagmanager.com/gtag/js?id=Tvoj-GA-ID-Ovdje"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'Tvoj-GA-ID-Ovdje');
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button class="back-btn hidden" id="back-to-home">←</button>
  <button class="back-btn hidden" id="back-to-line-detail">←</button>
  <button id="favorite-btn" class="favorite-btn hidden" onclick="toggleLineFavorite()">☆</button>

  <!-- POČETNA -->
  <div id="screen-home" class="screen active">
    <div class="screen-header">
      <div class="screen-header-title">Početna</div>
    </div>
    <div class="content">
      <div class="home-tabs">
        <div class="home-tab active" data-tab="notifications">Obavijesti</div>
        <div class="home-tab" data-tab="favorites">Omiljene</div>
      </div>
      <div id="home-tab-notifications" class="home-tab-content active">
        <div id="notifications-list"></div>
      </div>
      <div id="home-tab-favorites" class="home-tab-content">
        <div id="favorites-list"></div>
      </div>
    </div>
  </div>

  <!-- LINIJE -->
  <div class="screen" id="screen-lines">
    <div class="screen-header">
      <div class="screen-header-title">Linije</div>
      <div class="search-container" id="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="7" fill="none" stroke="rgb(150,150,150)" stroke-width="2"/>
          <line x1="16" y1="16" x2="21" y2="21" stroke="rgb(150,150,150)" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="text" id="search-input" placeholder="Pronađi liniju..." />
      </div>
    </div>
    <div class="content with-header">
      <div id="lines-list"></div>
    </div>
  </div>

  <!-- DETALJI LINIJE -->
  <div class="screen" id="screen-line-detail">
    <div class="screen-header screen-header-expanded" id="line-detail-header">
      <div class="screen-header-row">
        <div class="screen-header-title" id="header-title">Polasci</div>
        <span id="header-subtitle" class="header-subtitle hidden"></span>
      </div>
      <div class="calendar-strip" id="calendar-strip"></div>
      <div id="directions-tabs-header"></div>
    </div>
    <div class="content with-expanded-header">
      <div id="departures-list"></div>
    </div>
  </div>

  <!-- INFO -->
  <div class="screen" id="screen-info">
    <div class="screen-header">
      <div class="screen-header-title">Informacije</div>
    </div>
    <div class="content with-header">
      <h3 class="section-title" style="margin-top: 10px;">O PLATFORMI</h3>
      
      <div class="line-item" onclick="window.open('https://zenicatrans.com', '_blank')">
        <div class="line-number" style="background: transparent; font-size: 24px;">🌐</div>
        <span>Zvanični sajt prevoza</span>
      </div>

      <div class="line-item" onclick="window.location.href='mailto:markoopacak08@gmail.com'">
        <div class="line-number" style="background: transparent; font-size: 24px;">✉️</div>
        <span>Prijavi grešku (Email)</span>
      </div>

      <h3 class="section-title" style="margin-top: 30px;">SISTEM</h3>
      <p style="color: rgba(150, 150, 150, 1); padding: 0 16px; font-size: 14px; line-height: 1.5;">
        <strong>zePrevoz v1.0 (Beta)</strong><br>
        Razvijeno u Zenici. Podaci su informativnog karaktera i mogu odstupati zbog stanja u saobraćaju.
      </p>
    </div>
  </div>

  <!-- TRIP — nema header, ima svoj trip-header -->
  <div class="screen" id="screen-trip">
    <div class="trip-header" id="trip-header-container">
      <div class="trip-header-top" id="trip-header-top"></div>
      <div class="trip-header-line" id="trip-header-line"></div>
      <div class="trip-header-date" id="trip-date">Danas</div>
    </div>
    <div class="content trip-content">
      <div id="stops-list"></div>
    </div>
  </div>

  <!-- MAPA -->
  <div id="screen-map" class="screen">
    <div id="map-container" style="width: 100%; height: 100%;"></div>
  </div>

<!-- STOP SHEET -->
<div class="stop-sheet-backdrop" id="stop-sheet-backdrop" onclick="closeStopSheet()"></div>
<div class="stop-sheet" id="stop-sheet">
  <div class="stop-sheet-handle"></div>
  <div class="stop-sheet-header">
    <div class="stop-sheet-title-row">
      <span class="stop-sheet-icon">🚏</span>
      <span class="stop-sheet-name" id="stop-sheet-name"></span>
      <button class="stop-sheet-close" onclick="closeStopSheet()">✕</button>
    </div>
  </div>
  <div class="stop-sheet-section-title">Sljedeći polasci</div>
  <div class="stop-sheet-arrivals" id="stop-sheet-arrivals"></div>
</div>

<div class="bottom-nav">
    <div class="nav-item" onclick="switchToTab('home')">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Početna</span>
    </div>
    <div class="nav-item" onclick="switchToTab('lines')">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/></svg>
      <span>Linije</span>
    </div>
    <div class="nav-item" onclick="switchToTab('map')">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg>
      <span>Mapa</span>
    </div>
    <div class="nav-item" onclick="switchToTab('info')">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
      <span>Info</span>
    </div>
</div>

<script src="physical_stops.js"></script>
<script src="data.js"></script>
<script src="obavijesti.js"></script>
<script src="stop_direction_map.js"></script>
<script src="map.js"></script>
<script src="app.js"></script>
</body>
</html>
